# The differential harness shared by the version-independent API notes tests.
#
# A test names one Clang module and runs %{vi-parity}. That builds the module
# explicitly at every Swift version below, twice:
#
#   default-<v>.pcm   the default mode, which applies the API notes slice
#                     selected at <v> while building
#   capture-<v>.pcm   -version-independent-apinotes, which captures every slice
#                     for the consumer to collapse
#
# It prints each default-mode module at the version it was built at, and each
# captured module at every version. Each captured print has to match the
# default-mode print at the same version, so the building version of a captured
# module must not matter, and the default mode is the oracle for what every
# client sees.
#
# Known gaps are data, not XFAILs. Inputs/divergence-report.py writes a report
# of every captured print that differs from its oracle, and of every print that
# reported an error, and the harness compares it with %{vi-expected}. That is empty by default. A
# test whose fixture still diverges checks in the report under
# Inputs/known-divergence/, so a new divergence fails the test, and so does a
# fix, which then deletes its lines from the file.
#
# Errors are part of the report because swift-ide-test prints what it could
# import and exits successfully even when a dependency failed to load. Both
# modes then lose the same declarations, and the diffs alone would pass.
#
# Two controls keep a pass meaningful:
#
#   - The default-mode module built at the lowest version has to print
#     differently at the highest, or the fixture could not tell a captured
#     module from one that applied its notes while building.
#   - Clients get the module only through -fmodule-file, with no module map, so
#     none of them can build it implicitly instead.
#
# Module builds and clients share the test suite's module cache. A private one
# would rebuild every SDK dependency per test, and a module built against one
# cache fails to load its dependencies from another.
#
# A test sets the module through these parameters:
#
#   REDEFINE: %{vi-module} = VersionMatrix
#   REDEFINE: %{vi-map} = %S/Inputs/version-matrix/module.modulemap
#   REDEFINE: %{vi-flags} = -cxx-interoperability-mode=default
#   REDEFINE: %{vi-build-flags} = -F %S/../Inputs/custom-frameworks
#   REDEFINE: %{vi-client-flags} = -import-module Foundation
#   REDEFINE: %{vi-expected} = %S/Inputs/known-divergence/framework.txt
#
# A module can depend on one other module of the same kind, which
# %{vi-chain-parity} builds first in the same mode:
#
#   REDEFINE: %{vi-dep-module} = ChainBase
#   REDEFINE: %{vi-dep-map} = %S/Inputs/chain/ChainBase.modulemap
#
# Both go to clients through -fmodule-file. In the default mode the two are
# built at the same version. In capture mode each module is built against the
# dependency built at the next version up, wrapping around, so that the
# building versions of a chain of captured modules must not matter either.
#
# %{vi-flags} goes on both the module build and the client, so it has to be
# spelled in a way both accept. %{vi-build-flags} goes on the module build
# only, and %{vi-client-flags} on the client only. Search paths belong in
# %{vi-build-flags}: on a client they would let it find the module map.
#
# The module must not import SDK modules. Implicitly built dependencies land in
# a different context hash per Swift version (-D__swift__ differs), so a client
# at another version than the building one would load two copies of each. That
# is a limit of explicit builds today, not of API notes; a fixture that needs a
# framework type can forward-declare it and have the client import the
# framework through %{vi-client-flags}.

versions = ['4', '4.2', '5', '6']
lowest, highest = versions[0], versions[-1]
capture_flag = ' -version-independent-apinotes'

def emit_pcm(module, map, name, version, extra=''):
    return ('%target-swift-emit-pcm %mcp_opt -module-name ' + module + ' ' +
            map + ' %{vi-flags} %{vi-build-flags} -swift-version ' + version +
            ' -o %t/' + name + '.pcm' + extra)

def load(module, pcm):
    return ' -Xcc -fmodule-file=' + module + '=%t/' + pcm + '.pcm'

def print_module(pcm, version, output, extra=''):
    return ('%target-swift-ide-test -print-module -module-to-print=%{vi-module} '
            '-source-filename %s -function-definitions=false -swift-version ' +
            version + load('%{vi-module}', pcm) +
            ' %{vi-flags} %{vi-client-flags}' + extra + ' > %t/' + output +
            '.txt 2> %t/' + output + '.err')

def harness_commands(chain):
    # The dependency each module is built against, if any.
    def dep(mode, version):
        if not chain:
            return None
        if mode == 'capture':
            version = versions[(versions.index(version) + 1) % len(versions)]
        return 'dep-' + mode + '-' + version

    def dep_load(mode, version):
        d = dep(mode, version)
        return load('%{vi-dep-module}', d) if d else ''

    build = []
    if chain:
        for v in versions:
            build.append(emit_pcm('%{vi-dep-module}', '%{vi-dep-map}',
                                  'dep-default-' + v, v))
            build.append(emit_pcm('%{vi-dep-module}', '%{vi-dep-map}',
                                  'dep-capture-' + v, v,
                                  ' -Xfrontend' + capture_flag))
    for v in versions:
        build.append(emit_pcm('%{vi-module}', '%{vi-map}', 'default-' + v, v,
                              dep_load('default', v)))
        build.append(emit_pcm('%{vi-module}', '%{vi-map}', 'capture-' + v, v,
                              ' -Xfrontend' + capture_flag +
                              dep_load('capture', v)))

    prints = []
    for read in versions:
        prints.append(print_module('default-' + read, read, 'default-' + read,
                                   dep_load('default', read)))
        for built in versions:
            prints.append(print_module('capture-' + built, read,
                                       'capture-' + built + '-at-' + read,
                                       capture_flag +
                                       dep_load('capture', built)))

    sensitivity = 'default-' + lowest + '-at-' + highest
    prints.append(print_module('default-' + lowest, highest, sensitivity,
                               dep_load('default', lowest)))

    check = [
        'not %diff -q %t/default-' + highest + '.txt %t/' + sensitivity +
        '.txt',
        '%{python} %S/Inputs/divergence-report.py %t ' + ' '.join(versions) +
        ' > %t/divergence.txt',
        '%diff -u %{vi-expected} %t/divergence.txt',
    ]
    return ' && '.join(build + prints + check)

# Every macro precedes the substitutions it expands to, and the parameters
# precede %target-swift-ide-test and friends, so each pass of substitution
# finds what the previous one left.
harness = [
    ('%{vi-parity}', harness_commands(chain=False)),
    ('%{vi-chain-parity}', harness_commands(chain=True)),
    ('%{vi-module}', ''),
    ('%{vi-map}', ''),
    ('%{vi-dep-module}', ''),
    ('%{vi-dep-map}', ''),
    ('%{vi-flags}', ''),
    ('%{vi-build-flags}', ''),
    ('%{vi-client-flags}', ''),
    ('%{vi-expected}', '/dev/null'),
]
config.substitutions[0:0] = harness
